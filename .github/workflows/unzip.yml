name: Auto Unzip Project

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip uploaded archive
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting $f..."
              unzip -o "$f"
              rm "$f"
            fi
          done

      - name: Configure vercel.json if PHP files exist
        run: |
          if [ -d "api" ] && ls api/*.php 1> /dev/null 2>&1; then
            cat << 'EOF' > vercel.json
          {
            "functions": {
              "api/**/*.php": {
                "runtime": "vercel-php@0.7.1"
              }
            },
            "routes": [
              { "src": "/api/(.*)", "dest": "/api/$1" },
              { "src": "/assets/(.*)", "dest": "/assets/$1" },
              { "src": "/store/(.*)", "dest": "/store/$1" },
              { "src": "/(.*)", "dest": "/$1" }
            ]
          }
          EOF
          elif [ ! -f "vercel.json" ]; then
            cat << 'EOF' > vercel.json
          {
            "rewrites": [
              {
                "source": "/(.*)",
                "destination": "/index.html"
              }
            ]
          }
          EOF
          fi

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-extract project files for Vercel" && git push)
